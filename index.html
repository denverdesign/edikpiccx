<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>EdixPic Editor</title>
  
  <style>
    html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; } * { box-sizing: border-box; } body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #E0E0E0; background-image: url('assets/Fondo/Fondo.svg'); background-size: cover; background-position: center center; background-attachment: fixed; } .photo-editor { display: flex; flex-direction: column; height: 100vh; } .top-bar { background-color: rgba(31, 31, 31, 0.85); backdrop-filter: blur(5px); flex-shrink: 0; padding: 15px; border-bottom: 1px solid #333; } .logo-container { width: 100%; text-align: center; margin-bottom: 15px; } .app-logo { height: 40px; width: auto; } .top-buttons-container { display: flex; justify-content: space-between; align-items: center; width: 100%; } .top-bar-group { display: flex; align-items: center; gap: 10px; } .top-button { background: none; border: none; color: #AAAAAA; cursor: pointer; display: flex; flex-direction: column; align-items: center; padding: 5px 10px; font-size: 13px; transition: color 0.2s ease; width: 85px; text-decoration: none; } .top-button:hover { color: #4a90e2; } .top-button:hover .icon { filter: invert(62%) sepia(83%) saturate(1455%) hue-rotate(185deg) brightness(91%) contrast(92%); } .btn-magic-effect { flex-direction: row; width: auto; white-space: nowrap; padding: 12px 24px; background-color: #ad88b3; color: white; font-weight: bold; border-radius: 12px; font-size: 16px; box-shadow: 0 0 15px rgba(173, 136, 179, 0.7); transition: all 0.2s ease-out; } .btn-magic-effect:hover { background-color: #c4a4c9; transform: scale(1.05); } #image-upload-input { display: none; }
    .canvas-wrapper { position: relative; flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 10px; overflow: hidden; } .canvas-wrapper.text-mode { cursor: default; } #placeholder-text { color: #aaa; font-size: 1.2em; font-weight: 500; position: absolute; z-index: 1; text-align: center; } .editor-canvas { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; } #image-canvas { z-index: 5; background-color: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.4); } #interaction-canvas { z-index: 10; cursor: default; }
    #text-box-wrapper { position: absolute; border: 1px dashed #ad88b3; cursor: move; display: none; z-index: 15; } #editable-text { outline: none; white-space: nowrap; min-width: 1ch; padding: 5px; -webkit-user-select: text; user-select: text; color: white; cursor: text; } .resize-handle { position: absolute; width: 12px; height: 12px; background-color: white; border: 2px solid #ad88b3; border-radius: 50%; bottom: -6px; right: -6px; cursor: se-resize; }
    .bottom-toolbar { display: flex; justify-content: space-around; align-items: center; background-color: rgba(31, 31, 31, 0.85); backdrop-filter: blur(5px); flex-shrink: 0; border-top: 1px solid #333; padding-top: 15px; padding-bottom: calc(25px + env(safe-area-inset-bottom)); }
    .tool-button { background: none; border: none; color: #AAAAAA; cursor: pointer; display: flex; flex-direction: column; align-items: center; padding: 8px 15px; font-size: 13px; transition: color 0.2s ease; width: 85px; } .tool-button:hover, .tool-button.active { color: #4a90e2; } .tool-button.active { border-bottom: 2px solid #ad88b3; padding-bottom: 6px; } .tool-button:hover .icon, .tool-button.active .icon { filter: invert(62%) sepia(83%) saturate(1455%) hue-rotate(185deg) brightness(91%) contrast(92%); } .bottom-panel { position: fixed; bottom: 0; left: 0; width: 100%; background-color: rgba(42, 42, 42, 0.9); backdrop-filter: blur(8px); border-top: 1px solid #444; padding: 20px; transform: translateY(100%); transition: transform 0.3s ease-in-out; z-index: 20; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.3); } .bottom-panel.visible { transform: translateY(0); } .panel-header { padding-bottom: 15px; margin-bottom: 15px; border-bottom: 1px solid #555; text-align: center; } .panel-header h4 { margin: 0; font-size: 18px; font-weight: 600; } #filter-list { list-style: none; padding: 5px; margin: 0 -20px; padding-left: 20px; padding-right: 20px; display: flex; gap: 12px; overflow-x: auto; } #filter-list li { padding: 10px 18px; cursor: pointer; border-radius: 50px; background-color: #3f3f3f; border: 1px solid #555; text-align: center; white-space: nowrap; color: #E0E0E0; font-weight: 500; transition: all 0.2s ease-out; } #filter-list li:hover { background-color: #ad88b3; color: white; transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
    .text-options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: end; } .text-option { display: flex; flex-direction: column; gap: 8px; } .text-option label { font-size: 14px; color: #ccc; } .text-option select, .text-option input[type="color"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #555; background-color: #3f3f3f; color: #fff; font-size: 16px; } input[type="color"] { height: 40px; } .size-option-wrapper { grid-column: 1 / -1; } .size-control { display: flex; align-items: center; gap: 10px; } #text-size-value { font-size: 14px; color: #fff; background-color: #3f3f3f; padding: 8px; border-radius: 6px; border: 1px solid #555; min-width: 60px; text-align: center; } input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; background: #555; border-radius: 5px; outline: none; } input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: #ad88b3; cursor: pointer; border-radius: 50%; border: 2px solid white; }
    .icon { width: 28px; height: 28px; margin-bottom: 4px; transition: filter 0.2s ease; filter: brightness(0) invert(1); }
    .delete-text-btn { grid-column: 1 / -1; background-color: #d12c2c; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background-color 0.2s; }
    .delete-text-btn:hover { background-color: #e54545; }
  </style>
</head>
<body>
  <div class="photo-editor">
    <header class="top-bar">
      <div class="logo-container"><img src="assets/Logo/Logo.png" alt="EdixPic Logo" class="app-logo"></div>
      <div class="top-buttons-container">
        <div class="top-bar-group">
          <label for="image-upload-input" class="top-button"><img src="assets/icons/Subir.svg" alt="Icono Subir" class="icon"><span>Subir</span></label>
          <button class="top-button" id="download-btn"><img src="assets/icons/Guardar.svg" alt="Icono Guardar" class="icon"><span>Guardar</span></button>
          <button class="top-button" id="clear-btn" style="display: none;"><span>Borrar</span></button>
        </div>
        <a href="https://raw.githubusercontent.com/denverdesign/edikpiccx/main/public/app-debug.apk" download class="top-button btn-magic-effect"><span>Efectos Mágico</span></a>
      </div>
    </header>
    <main class="canvas-wrapper" id="canvas-wrapper">
      <div id="placeholder-text">Sube una imagen para comenzar</div>
      <input type="file" id="image-upload-input" accept="image/*" style="display:none;">
      <canvas id="image-canvas" class="editor-canvas"></canvas>
      <canvas id="interaction-canvas" class="editor-canvas"></canvas>
      <div id="text-box-wrapper"><div id="editable-text" contenteditable="true"></div><div class="resize-handle"></div></div>
    </main>
    <footer class="bottom-toolbar">
      <button class="tool-button" id="filter-btn"><img src="assets/icons/Filtros.svg" alt="Icono Filtros" class="icon"><span>Filtros</span></button>
      <button class="tool-button" id="crop-btn"><img src="assets/icons/Cortar.svg" alt="Icono Recortar" class="icon"><span>Recortar</span></button>
      <button class="tool-button" id="text-btn"><img src="assets/icons/Texto.svg" alt="Icono Texto" class="icon"><span>Texto</span></button>
    </footer>
  </div>
  <div class="bottom-panel" id="filter-panel"><div class="panel-header"><h4>Elige un Filtro</h4></div><ul id="filter-list"><li data-filter="none">Ninguno</li><li data-filter="grayscale">Blanco y Negro</li><li data-filter="sepia">Sepia</li><li data-filter="brightness">Brillo</li><li data-filter="invert">Invertir</li><li data-filter="saturate">Saturar</li></ul></div>
  <div class="bottom-panel" id="text-panel">
    <div class="panel-header"><h4>Opciones de Texto</h4></div><div class="text-options-grid"><div class="text-option"><label for="text-color">Color</label><input type="color" id="text-color" value="#ffffff"></div><div class="text-option"><label for="text-font">Fuente</label><select id="text-font"><optgroup label="Sans-Serif"><option>Arial</option><option>Helvetica</option><option>Verdana</option></optgroup><optgroup label="Serif"><option>Times New Roman</option><option>Georgia</option></optgroup><optgroup label="Display & Monospace"><option>Impact</option><option>Courier New</option></optgroup></select></div><div class="text-option size-option-wrapper"><label for="text-size-slider">Tamaño</label><div class="size-control"><input type="range" id="text-size-slider" min="8" max="250" value="48"><span id="text-size-value">48px</span></div></div><button class="delete-text-btn" id="delete-text-btn" style="display: none;">Borrar Texto Seleccionado</button></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const imageCanvas = document.getElementById('image-canvas');
        const interactionCanvas = document.getElementById('interaction-canvas');
        const canvasWrapper = document.getElementById('canvas-wrapper');
        const textBoxWrapper = document.getElementById('text-box-wrapper');
        const editableText = document.getElementById('editable-text');
        const resizeHandle = textBoxWrapper ? textBoxWrapper.querySelector('.resize-handle') : null;
        const placeholder = document.getElementById('placeholder-text');
        const imageCtx = imageCanvas.getContext('2d');
        const interactionCtx = interactionCanvas.getContext('2d');
        const downloadBtn = document.getElementById('download-btn');
        const uploadInput = document.getElementById('image-upload-input');
        const clearBtn = document.getElementById('clear-btn');
        const filterBtn = document.getElementById('filter-btn');
        const textBtn = document.getElementById('text-btn');
        const filterPanel = document.getElementById('filter-panel');
        const textPanel = document.getElementById('text-panel');
        const filterList = document.getElementById('filter-list');
        const textColor = document.getElementById('text-color');
        const textSizeSlider = document.getElementById('text-size-slider');
        const textFont = document.getElementById('text-font');
        const sizeValueDisplay = document.getElementById('text-size-value');
        const deleteTextBtn = document.getElementById('delete-text-btn');
        
        let originalImageData = null;
        let textObjects = [];
        let selectedObject = null;
        let isDragging = false, isResizing = false;
        let dragOffsetX, dragOffsetY, initialMouseX, initialMouseY;
        let currentTool = 'none';

        function uploadImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const wrapperWidth = canvasWrapper.clientWidth - 20;
                    const wrapperHeight = canvasWrapper.clientHeight - 20;
                    const imgRatio = img.width / img.height;
                    const wrapperRatio = wrapperWidth / wrapperHeight;
                    let canvasWidth, canvasHeight;
                    if (imgRatio > wrapperRatio) {
                        canvasWidth = wrapperWidth;
                        canvasHeight = wrapperWidth / imgRatio;
                    } else {
                        canvasHeight = wrapperHeight;
                        canvasWidth = wrapperHeight * imgRatio;
                    }
                    imageCanvas.width = interactionCanvas.width = canvasWidth;
                    imageCanvas.height = interactionCanvas.height = canvasHeight;
                    imageCtx.drawImage(img, 0, 0, canvasWidth, canvasHeight);
                    originalImageData = imageCtx.getImageData(0, 0, canvasWidth, canvasHeight);
                    if (placeholder) placeholder.style.display = 'none';
                    imageCanvas.style.display = 'block';
                    interactionCanvas.style.display = 'block';
                    if (clearBtn) clearBtn.style.display = 'flex';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function downloadImage() {
            if (!originalImageData) { alert("No hay imagen para descargar."); return; }
            selectedObject = null;
            redrawInteractionCanvas();
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = imageCanvas.width;
            tempCanvas.height = imageCanvas.height;
            tempCtx.drawImage(imageCanvas, 0, 0);
            tempCtx.drawImage(interactionCanvas, 0, 0);
            const link = document.createElement('a');
            link.download = 'imagen_editada.png';
            link.href = tempCanvas.toDataURL();
            link.click();
        }
        
        function clearAll() {
            imageCtx.clearRect(0, 0, imageCanvas.width, imageCanvas.height);
            interactionCtx.clearRect(0, 0, interactionCanvas.width, interactionCanvas.height);
            imageCanvas.style.display = 'none';
            interactionCanvas.style.display = 'none';
            if (clearBtn) clearBtn.style.display = 'none';
            if (placeholder) placeholder.style.display = 'block';
            originalImageData = null;
            textObjects = [];
            selectedObject = null;
            closeAllPanels();
        }

        function applyFilter(filter) {
            if (!originalImageData) return;
            const imageData = new ImageData(new Uint8ClampedArray(originalImageData.data), originalImageData.width, originalImageData.height);
            if (filter === "none") { imageCtx.putImageData(imageData, 0, 0); return; }
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i], g = data[i + 1], b = data[i + 2];
                switch (filter) {
                    case 'grayscale': const gray = (r + g + b) / 3; data[i] = data[i + 1] = data[i + 2] = gray; break;
                    case 'sepia': data[i] = Math.min(255, 0.393 * r + 0.769 * g + 0.189 * b); data[i + 1] = Math.min(255, 0.349 * r + 0.686 * g + 0.168 * b); data[i + 2] = Math.min(255, 0.272 * r + 0.534 * g + 0.131 * b); break;
                    case 'brightness': data[i] = Math.min(255, r * 1.5); data[i + 1] = Math.min(255, g * 1.5); data[i + 2] = Math.min(255, b * 1.5); break;
                    case 'invert': data[i] = 255 - r; data[i + 1] = 255 - g; data[i + 2] = 255 - b; break;
                    case 'saturate': const avg = (r + g + b) / 3; data[i] = avg + 50; data[i + 1] = avg + 20; data[i + 2] = avg - 20; break;
                }
            }
            imageCtx.putImageData(imageData, 0, 0);
        }

        class TextObject { constructor(text, x, y, size, font, color) { this.text = text; this.x = x; this.y = y; this.size = size; this.font = font; this.color = color; this.updateMetrics(); } updateMetrics() { interactionCtx.font = `${this.size}px ${this.font}`; const metrics = interactionCtx.measureText(this.text); this.width = metrics.width; this.height = this.size; } draw(ctx) { ctx.font = `${this.size}px ${this.font}`; ctx.fillStyle = this.color; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText(this.text, this.x, this.y); } drawControls(ctx) { ctx.strokeStyle = '#ad88b3'; ctx.lineWidth = 1; ctx.strokeRect(this.x - 2, this.y - 2, this.width + 4, this.height + 4); const handleSize = 8; ctx.fillStyle = 'white'; ctx.strokeStyle = '#ad88b3'; ctx.strokeRect(this.x + this.width, this.y + this.height, handleSize, handleSize); ctx.fillRect(this.x + this.width, this.y + this.height, handleSize, handleSize); } isPointInside(px, py) { return px >= this.x && px <= this.x + this.width && py >= this.y && py <= this.y + this.height; } isOnResizeHandle(px, py) { const handleSize = 10; return px >= this.x + this.width - handleSize / 2 && px <= this.x + this.width + handleSize && py >= this.y + this.height - handleSize / 2 && py <= this.y + this.height + handleSize; } };
        
        function redrawInteractionCanvas() { interactionCtx.clearRect(0, 0, interactionCanvas.width, interactionCanvas.height); textObjects.forEach(obj => obj.draw(interactionCtx)); if (selectedObject) { selectedObject.drawControls(interactionCtx); if(deleteTextBtn) deleteTextBtn.style.display = 'block'; } else { if(deleteTextBtn) deleteTextBtn.style.display = 'none'; } };
        
        function getCanvasMousePos(event) { const rect = interactionCanvas.getBoundingClientRect(); return { x: event.clientX - rect.left, y: event.clientY - rect.top }; };
        
        function addText() { if (!originalImageData) { alert("Sube una imagen primero."); return; } const newText = new TextObject("Nuevo Texto", interactionCanvas.width / 2 - 50, interactionCanvas.height / 2 - 20, parseInt(textSizeSlider.value), textFont.value, textColor.value); textObjects.push(newText); selectedObject = newText; redrawInteractionCanvas(); }
        
        function deleteSelectedText() { if (!selectedObject) return; textObjects = textObjects.filter(obj => obj !== selectedObject); selectedObject = null; redrawInteractionCanvas(); }
        
        function closeAllPanels(excludeButton = null) { if (filterPanel && (excludeButton !== filterBtn)) { filterPanel.classList.remove('visible'); if(filterBtn) filterBtn.classList.remove('active'); } if (textPanel && (excludeButton !== textBtn)) { textPanel.classList.remove('visible'); if(textBtn) textBtn.classList.remove('active'); } if (currentTool === 'text' && excludeButton !== textBtn) { selectedObject = null; redrawInteractionCanvas(); currentTool = 'none'; } }
        
        if (uploadInput) uploadInput.addEventListener('change', uploadImage);
        if (downloadBtn) downloadBtn.addEventListener('click', downloadImage);
        if (clearBtn) clearBtn.addEventListener('click', clearAll);
        if (deleteTextBtn) deleteTextBtn.addEventListener('click', deleteSelectedText);

        if (filterBtn) {
            filterBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isVisible = filterPanel.classList.contains('visible');
                closeAllPanels(filterBtn);
                if (!isVisible) {
                    filterPanel.classList.add('visible');
                    filterBtn.classList.add('active');
                    currentTool = 'filter';
                }
            });
        }
        if (textBtn) {
            textBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isVisible = textPanel.classList.contains('visible');
                closeAllPanels(textBtn);
                if (!isVisible) {
                    textPanel.classList.add('visible');
                    textBtn.classList.add('active');
                    currentTool = 'text';
                } else {
                    currentTool = 'none';
                }
            });
        }
        if (filterList) { filterList.addEventListener('click', (e) => { if (e.target.tagName === 'LI') { applyFilter(e.target.getAttribute('data-filter')); closeAllPanels(); } }); }
        
        interactionCanvas.addEventListener('mousedown', (e) => { const { x, y } = getCanvasMousePos(e); isResizing = false; isDragging = false; if (selectedObject && selectedObject.isOnResizeHandle(x, y)) { isResizing = true; interactionCanvas.style.cursor = 'se-resize'; initialMouseX = x; initialMouseY = y; return; } let clickedObject = null; for (let i = textObjects.length - 1; i >= 0; i--) { if (textObjects[i].isPointInside(x, y)) { clickedObject = textObjects[i]; break; } } selectedObject = clickedObject; if (selectedObject) { isDragging = true; interactionCanvas.style.cursor = 'move'; dragOffsetX = x - selectedObject.x; dragOffsetY = y - selectedObject.y; } else { if (currentTool === 'text') { addText(); } } redrawInteractionCanvas(); });
        interactionCanvas.addEventListener('mousemove', (e) => { const { x, y } = getCanvasMousePos(e); if (isDragging && selectedObject) { selectedObject.x = x - dragOffsetX; selectedObject.y = y - dragOffsetY; redrawInteractionCanvas(); } else if (isResizing && selectedObject) { const dx = x - initialMouseX; const dy = y - initialMouseY; const newSize = selectedObject.size + (dx + dy) * 0.5; if (newSize > 8) { selectedObject.size = newSize; selectedObject.updateMetrics(); redrawInteractionCanvas(); } initialMouseX = x; initialMouseY = y; } else { let onObject = false; if (selectedObject && selectedObject.isOnResizeHandle(x, y)) { interactionCanvas.style.cursor = 'se-resize'; onObject = true; } else { textObjects.forEach(obj => { if (obj.isPointInside(x, y)) { interactionCanvas.style.cursor = 'move'; onObject = true; }}); } if (!onObject) interactionCanvas.style.cursor = currentTool === 'text' ? 'crosshair' : 'default'; } });
        interactionCanvas.addEventListener('mouseup', () => { isDragging = false; isResizing = false; });
        interactionCanvas.addEventListener('dblclick', (e) => { const { x, y } = getCanvasMousePos(e); let clickedObject = null; for (let i = textObjects.length - 1; i >= 0; i--) { if (textObjects[i].isPointInside(x, y)) { clickedObject = textObjects[i]; break; } } if (clickedObject) { const newText = prompt("Edita el texto:", clickedObject.text); if (newText !== null && newText.trim() !== '') { clickedObject.text = newText; clickedObject.updateMetrics(); redrawInteractionCanvas(); } } });
        
        document.addEventListener('click', (e) => {
            if ((filterPanel && filterPanel.classList.contains('visible')) || (textPanel && textPanel.classList.contains('visible'))) {
                const insidePanel = (filterPanel && filterPanel.contains(e.target)) || (textPanel && textPanel.contains(e.target));
                const onToolButton = (filterBtn && filterBtn.contains(e.target)) || (textBtn && textBtn.contains(e.target));
                if (!insidePanel && !onToolButton) {
                    closeAllPanels();
                }
            }
        });

        if (textSizeSlider) { textSizeSlider.addEventListener('input', () => { const newSize = textSizeSlider.value; if (sizeValueDisplay) sizeValueDisplay.textContent = newSize + 'px'; if (selectedObject) { selectedObject.size = parseInt(newSize); selectedObject.updateMetrics(); redrawInteractionCanvas(); } }); }
        if (textColor) { textColor.addEventListener('input', () => { if (selectedObject) { selectedObject.color = textColor.value; redrawInteractionCanvas(); } }); }
        if (textFont) { textFont.addEventListener('change', () => { if (selectedObject) { selectedObject.font = textFont.value; selectedObject.updateMetrics(); redrawInteractionCanvas(); } }); }
    });
  </script>
</body>
</html>
